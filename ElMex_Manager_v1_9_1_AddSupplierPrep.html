let sectionDrag={area:null,section:null,row:null};
function renderSections(){let body=`<div class="card"><div class="row"><button class="primary" onclick="addArea()">➕ Add Area</button><button onclick="addSectionPrompt()">➕ Add Section</button></div><div class="hint"><b>Press and hold ☰, then drag a section up or down.</b> Release it where you want it. You can still use Manage to rename, move, or delete it.</div></div>`;meta.areas.forEach(a=>{body+=`<div class="card sectionCard"><div class="row"><div><h2>${esc(a)}</h2></div><button onclick="areaActions(${js(a)})">⋮ Area</button></div><div class="sectionList" data-area="${esc(a)}">${(meta.sectionMap[a]||[]).map(s=>{const count=items.filter(x=>x.area===a&&x.section===s).length;return `<div class="sectionRow" data-section="${esc(s)}"><div><b>${esc(s)}</b><div class="meta">${count} items</div></div><div class="orderBtns"><button class="sectionDragHandle" title="Press and drag" onpointerdown="beginSectionDrag(event,${js(a)},${js(s)})" onpointermove="moveSectionDrag(event)" onpointerup="endSectionDrag(event)" onpointercancel="endSectionDrag(event)">☰</button><button class="mini" onclick="sectionActions(${js(a)},${js(s)})">Manage</button></div></div>`}).join('')}</div></div>`});shell('Manage Sections','Add, rename, move, delete, or reorder sections',body,`<button onclick="go('settings')">Back</button><button onclick="go('home')">Home</button>`)}
function beginSectionDrag(ev,a,s){if(ev.button!==undefined&&ev.button!==0)return;const row=ev.currentTarget.closest('.sectionRow');if(!row)return;sectionDrag={area:a,section:s,row};row.classList.add('draggingSection');document.body.classList.add('reordering');try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()}
function moveSectionDrag(ev){const row=sectionDrag.row;if(!row)return;ev.preventDefault();const el=document.elementFromPoint(ev.clientX,ev.clientY),target=el&&el.closest('.sectionRow');if(!target||target===row||target.parentElement!==row.parentElement)return;const r=target.getBoundingClientRect();if(ev.clientY<r.top+r.height/2)target.parentElement.insertBefore(row,target);else target.parentElement.insertBefore(row,target.nextSibling)}
function endSectionDrag(ev){const row=sectionDrag.row;if(!row)return;const list=row.parentElement,area=sectionDrag.area;meta.sectionMap[area]=[...list.querySelectorAll('.sectionRow[data-section]')].map(el=>el.dataset.section);row.classList.remove('draggingSection');document.body.classList.remove('reordering');sectionDrag={area:null,section:null,row:null};save('Section order changed');renderSections()}
function startLongPress(fn){cancelLongPress();longPressTimer=setTimeout(fn,650)}function cancelLongPress(){clearTimeout(longPressTimer)}
function sectionActions(a,s){document.getElementById('actionTitle').textContent='Manage '+s;document.getElementById('actionBody').innerHTML=`<div class="row"><button onclick="renameSection(${js(a)},${js(s)})">Rename</button><button onclick="moveSection(${js(a)},${js(s)})">Move to Area</button><button class="danger" onclick="deleteSection(${js(a)},${js(s)})">Delete</button></div>`;document.getElementById('actionModal').style.display='block'}
function areaActions(a){document.getElementById('actionTitle').textContent='Manage '+a;document.getElementById('actionBody').innerHTML=`<div class="row"><button onclick="renameArea(${js(a)})">Rename Area</button><button class="danger" onclick="deleteArea(${js(a)})">Delete Area</button></div>`;document.getElementById('actionModal').style.display='block'}
function addArea(){const v=prompt('New area name');if(v&&v.trim()&&!meta.areas.includes(v.trim())){meta.areas.push(v.trim());meta.sectionMap[v.trim()]=[];save('Area added');render()}}
function addSectionPrompt(){const area=prompt('Enter the area for the new section:\n'+meta.areas.join(', '));if(!area||!meta.areas.includes(area.trim()))return alert('Area not found.');const s=prompt('New section name');if(s&&s.trim()&&!meta.sectionMap[area.trim()].includes(s.trim())){meta.sectionMap[area.trim()].push(s.trim());save('Section added');render()}}
function renameArea(a){const v=prompt('Rename area:',a);if(!v||!v.trim()||v.trim()===a)return;const n=v.trim();items.forEach(x=>{if(x.area===a)x.area=n});meta.areas=meta.areas.map(x=>x===a?n:x);meta.sectionMap[n]=meta.sectionMap[a]||[];delete meta.sectionMap[a];closeModal('actionModal');save('Area renamed');render()}
function renameSection(a,s){const v=prompt('Rename section:',s);if(!v||!v.trim()||v.trim()===s)return;const n=v.trim();items.forEach(x=>{if(x.area===a&&x.section===s)x.section=n});meta.sectionMap[a]=meta.sectionMap[a].map(x=>x===s?n:x);closeModal('actionModal');save('Section renamed');render()}
function moveSection(a,s){const dest=prompt('Move this section to which area?\n'+meta.areas.filter(x=>x!==a).join(', '));if(!dest||!meta.areas.includes(dest.trim()))return alert('Area not found.');const d=dest.trim();meta.sectionMap[a]=meta.sectionMap[a].filter(x=>x!==s);if(!meta.sectionMap[d].includes(s))meta.sectionMap[d].push(s);items.forEach(x=>{if(x.area===a&&x.section===s)x.area=d});closeModal('actionModal');save('Section moved');render()}
function deleteSection(a,s){const affected=items.filter(x=>x.area===a&&x.section===s);if(affected.length){const dest=prompt(`${affected.length} items are in this section. Enter another section in ${a} to move them to before deletion:\n${(meta.sectionMap[a]||[]).filter(x=>x!==s).join(', ')}`);if(!dest||(meta.sectionMap[a]||[]).filter(x=>x!==s).indexOf(dest.trim())<0)return alert('Deletion canceled. A valid destination section is required.');affected.forEach(x=>x.section=dest.trim())}if(!confirm('Delete section '+s+'?'))return;meta.sectionMap[a]=meta.sectionMap[a].filter(x=>x!==s);closeModal('actionModal');save('Section deleted');render()}
function deleteArea(a){const affected=items.filter(x=>x.area===a);if(affected.length)return alert('Move or delete all sections and items from this area first.');if(!confirm('Delete empty area '+a+'?'))return;meta.areas=meta.areas.filter(x=>x!==a);delete meta.sectionMap[a];closeModal('actionModal');save('Area deleted');render()}
function renderSuppliers(){let body=`<div class="card"><button class="primary" onclick="editSupplier('')">➕ Add Supplier</button><div class="hint">Press and hold a supplier for actions, or use Manage.</div></div>`;body+=suppliers.map(s=>{const p=supplierProfiles[s]||{},count=items.filter(x=>x.supplier===s).length;return `<div class="card" onpointerdown="startLongPress(()=>supplierActions(${js(s)}))" onpointerup="cancelLongPress()"><h2>${esc(s)}</h2><div class="meta">${count} items • ${esc(p.contact||'No contact')} • ${esc(p.phone||'No phone')}</div><button class="mini" onclick="event.stopPropagation();supplierActions(${js(s)})">Manage</button></div>`}).join('');shell('Manage Suppliers','Add, edit profiles, or delete suppliers',body,`<button onclick="go('settings')">Back</button>`)}
function supplierActions(s){document.getElementById('actionTitle').textContent='Manage '+s;document.getElementById('actionBody').innerHTML=`<div class="row"><button onclick="editSupplier(${js(s)})">Edit Profile</button><button class="danger" onclick="deleteSupplier(${js(s)})">Delete</button></div>`;document.getElementById('actionModal').style.display='block'}
function editSupplier(old){const p=old?supplierProfiles[old]||{}:{};closeModal('actionModal');shell(old?'Edit Supplier':'Add Supplier',old||'',`<div class="card"><div class="label">Supplier name</div><input id="supName" value="${esc(old)}"><div class="label">Contact person</div><input id="supContact" value="${esc(p.contact||'')}"><div class="label">Phone</div><input id="supPhone" value="${esc(p.phone||'')}"><div class="label">Email</div><input id="supEmail" value="${esc(p.email||'')}"><div class="label">Website</div><input id="supWebsite" value="${esc(p.website||'')}"><div class="label">Ordering method</div><input id="supMethod" value="${esc(p.method||'')}"><div class="label">Notes</div><textarea id="supNotes">${esc(p.notes||'')}</textarea><button class="primary" onclick="saveSupplier(${js(old)})">Save Supplier</button></div>`,`<button onclick="go('suppliers')">Back</button>`)}
function saveSupplier(old){const n=supName.value.trim();if(!n)return alert('Supplier name is required.');if(!old&&suppliers.includes(n))return alert('That supplier already exists.');const p={contact:supContact.value.trim(),phone:supPhone.value.trim(),email:supEmail.value.trim(),website:supWebsite.value.trim(),method:supMethod.value.trim(),notes:supNotes.value.trim()};if(old&&old!==n){items.forEach(x=>{if(x.supplier===old)x.supplier=n});suppliers=suppliers.map(x=>x===old?n:x);delete supplierProfiles[old]}else if(!old)suppliers.push(n);supplierProfiles[n]=p;save('Supplier saved');go('suppliers')}
function deleteSupplier(s){const affected=items.filter(x=>x.supplier===s);if(affected.length){const dest=prompt(`${affected.length} items use this supplier. Enter another supplier to reassign them to:\n${suppliers.filter(x=>x!==s).join(', ')}`);if(!dest||!suppliers.filter(x=>x!==s).includes(dest.trim()))return alert('Deletion canceled. A valid replacement supplier is required.');affected.forEach(x=>x.supplier=dest.trim())}if(!confirm('Delete supplier '+s+'?'))return;suppliers=suppliers.filter(x=>x!==s);delete supplierProfiles[s];closeModal('actionModal');save('Supplier deleted');render()}
function filteredItems(){const f=state.itemFilters;return items.filter(x=>(!f.area||x.area===f.area)&&(!f.section||x.section===f.section)&&(!f.supplier||x.supplier===f.supplier)&&(!f.q||(x.name+' '+x.section+' '+x.supplier).toLowerCase().includes(f.q.toLowerCase())))}
function renderItems(){const f=state.itemFilters,list=filteredItems();const sectionsForArea=f.area?(meta.sectionMap[f.area]||[]):[...new Set(items.map(x=>x.section))].sort();let body=`<div class="toolbar"><div class="card"><div class="row"><input placeholder="Search items" value="${esc(f.q||'')}" oninput="state.itemFilters.q=this.value;save('Filter changed');renderItems()"><select onchange="state.itemFilters.area=this.value;state.itemFilters.section='';save('Filter changed');renderItems()">${opt(meta.areas,f.area,'All areas')}</select><select onchange="state.itemFilters.section=this.value;save('Filter changed');renderItems()">${opt(sectionsForArea,f.section,'All sections')}</select><select onchange="state.itemFilters.supplier=this.value;save('Filter changed');renderItems()">${opt(suppliers,f.supplier,'All suppliers')}</select></div><div class="row" style="margin-top:8px"><button class="primary" onclick="openEditItem(0,'items')">➕ Add Item</button><button onclick="toggleSelectionMode()">${state.selectionMode?'Exit Select':'Select Multiple'}</button>${state.selectionMode?`<button onclick="selectAllFiltered()">Select All (${list.length})</button>`:''}</div></div></div>`;if(state.selectionMode&&state.selectedItems.length)body+=`<div class="card"><b>${state.selectedItems.length} selected</b><div class="row" style="margin-top:8px"><button onclick="bulkMoveArea()">Move Area</button><button onclick="bulkMoveSection()">Move Section</button><button onclick="bulkSupplier()">Change Supplier</button><button class="danger" onclick="bulkDelete()">Delete</button></div></div>`;body+=`<div class="card">${list.map(x=>`<div class="listLine ${state.selectedItems.includes(x.id)?'selected':''}" onclick="itemTap(${x.id})" onpointerdown="startLongPress(()=>longSelect(${x.id}))" onpointerup="cancelLongPress()"><b>${state.selectedItems.includes(x.id)?'☑ ':''}${esc(x.name)}</b><div class="meta">${esc(x.area)} → ${esc(x.section)} • ${esc(x.supplier)}</div><button class="mini" onclick="event.stopPropagation();itemActions(${x.id})">⋮</button></div>`).join('')||'No matching items.'}</div>`;shell('Manage Items','Filter, multi-select, and bulk organize',body,`<button onclick="go('settings')">Back</button><button onclick="go('home')">Home</button>`)}
function toggleSelectionMode(){state.selectionMode=!state.selectionMode;if(!state.selectionMode)state.selectedItems=[];save('Selection mode');render()}
function itemTap(id){if(state.selectionMode){toggleSelect(id)}else openEditItem(id,'items')}
function longSelect(id){state.selectionMode=true;toggleSelect(id)}
function toggleSelect(id){const i=state.selectedItems.indexOf(id);if(i>=0)state.selectedItems.splice(i,1);else state.selectedItems.push(id);save('Items selected');render()}
function selectAllFiltered(){state.selectedItems=[...new Set([...state.selectedItems,...filteredItems().map(x=>x.id)])];save('Items selected');render()}
function itemActions(id){const x=byId(id);document.getElementById('actionTitle').textContent=x.name;document.getElementById('actionBody').innerHTML=`<div class="row"><button onclick="closeModal('actionModal');openEditItem(${id},'items')">Edit</button><button onclick="closeModal('actionModal');state.selectionMode=true;toggleSelect(${id})">Select</button><button class="danger" onclick="deleteOneItem(${id})">Delete</button></div>`;document.getElementById('actionModal').style.display='block'}
function bulkMoveArea(){const a=prompt('Move selected items to which area?\n'+meta.areas.join(', '));if(!a||!meta.areas.includes(a.trim()))return alert('Area not found.');const sec=(meta.sectionMap[a.trim()]||[])[0]||'Unassigned';items.filter(x=>state.selectedItems.includes(x.id)).forEach(x=>{x.area=a.trim();if(!(meta.sectionMap[a.trim()]||[]).includes(x.section))x.section=sec});save('Bulk area move');render()}
function bulkMoveSection(){const a=prompt('Enter destination area:\n'+meta.areas.join(', '));if(!a||!meta.areas.includes(a.trim()))return alert('Area not found.');const s=prompt('Enter destination section:\n'+(meta.sectionMap[a.trim()]||[]).join(', '));if(!s||!(meta.sectionMap[a.trim()]||[]).includes(s.trim()))return alert('Section not found.');items.filter(x=>state.selectedItems.includes(x.id)).forEach(x=>{x.area=a.trim();x.section=s.trim()});save('Bulk section move');render()}
function bulkSupplier(){const s=prompt('Assign selected items to which supplier?\n'+suppliers.join(', '));if(!s||!suppliers.includes(s.trim()))return alert('Supplier not found.');items.filter(x=>state.selectedItems.includes(x.id)).forEach(x=>x.supplier=s.trim());save('Bulk supplier change');render()}
function bulkDelete(){if(!confirm('Delete '+state.selectedItems.length+' selected items?'))return;items=items.filter(x=>!state.selectedItems.includes(x.id));state.selectedItems=[];save('Bulk delete');render()}
function deleteOneItem(id){if(!confirm('Delete this item?'))return;items=items.filter(x=>x.id!==id);closeModal('actionModal');save('Item deleted');render()}
function openEditItem(id,returnScreen='items',presetArea='',presetSection=''){const x=id?byId(id):{area:presetArea||meta.areas[0],section:presetSection||((meta.sectionMap[presetArea||meta.areas[0]]||[])[0]||'Unassigned'),supplier:suppliers[0],unit:'Case',orderIncrement:1};state.returnScreen=returnScreen;shell(id?'Edit Item':'Add Item',x.name||'',`<div class="card"><div class="label">Name</div><input id="fName" value="${esc(x.name||'')}"><div class="label">Area</div><select id="fArea" onchange="refreshSectionSelect()">${opt(meta.areas,x.area)}</select><div class="label">Section</div><select id="fSection">${opt(meta.sectionMap[x.area]||[],x.section)}</select><div class="label">Supplier</div><select id="fSupplier">${opt(suppliers,x.supplier)}</select><div class="label">Inventory / order unit</div><select id="fUnit">${opt(meta.units,x.unit||x.orderUnit)}</select><div class="label">Allowed order increment</div><select id="fIncrement"><option value="1" ${Number(x.orderIncrement||1)===1?'selected':''}>Whole only (1)</option><option value="0.5" ${Number(x.orderIncrement)===.5?'selected':''}>Half case (½)</option><option value="0.25" ${Number(x.orderIncrement)===.25?'selected':''}>Quarter case (¼)</option><option value="0.333333" ${Math.abs(Number(x.orderIncrement)-1/3)<.01?'selected':''}>Third case (⅓)</option></select><div class="hint">This controls the choices shown when entering the order quantity.</div><br><button class="primary" onclick="saveItem(${id||0})">Save Item</button>${id?` <button class="danger" onclick="deleteOneItem(${id})">Delete</button>`:''}</div>`,`<button onclick="go('${returnScreen}')">Back</button>`)}
function refreshSectionSelect(){fSection.innerHTML=opt(meta.sectionMap[fArea.value]||[],'')}
function saveItem(id){const f={name:fName.value.trim(),area:fArea.value,section:fSection.value,supplier:fSupplier.value,unit:fUnit.value,inventoryUnit:fUnit.value,orderUnit:fUnit.value,unitsPerOrderUnit:1,orderIncrement:Number(fIncrement.value||1)};if(!f.name)return alert('Name is required.');if(id)Object.assign(byId(id),f);else{let sortOrder=Math.max(0,...items.filter(x=>x.area===f.area&&x.section===f.section).map(x=>Number(x.sortOrder||0)))+1;const p=state.pendingInsert;if(p&&p.area===f.area&&p.section===f.section){normalizeSectionOrder(f.area,f.section);sortOrder=Math.max(0,Number(p.index||0));items.filter(x=>x.area===f.area&&x.section===f.section&&Number(x.sortOrder)>=sortOrder).forEach(x=>x.sortOrder=Number(x.sortOrder)+1)}items.push({...f,id:Date.now(),sortOrder,caseOnHand:0,unitOnHand:0,caseOrder:0,unitOrder:0,purchased:false,sectionDone:false,touched:false});state.pendingInsert=null}const ret=state.returnScreen||'items';save('Item saved');go(ret)}

let layoutDrag={id:null,row:null,pointerId:null};
function renderLayout(){const area=state.layoutArea||meta.areas[0]||'',secs=meta.sectionMap[area]||[],section=secs.includes(state.layoutSection)?state.layoutSection:(secs[0]||'');state.layoutArea=area;state.layoutSection=section;const list=items.filter(x=>x.area===area&&x.section===section).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)||String(a.name).localeCompare(String(b.name)));let rows=`<button class="insertHere" onclick="addItemAtPosition(${js(area)},${js(section)},0)">＋ Add item at the beginning</button>`;list.forEach((x,i)=>{rows+=`<div class="orderRow" data-id="${x.id}"><div><b>${i+1}. ${esc(x.name)}</b><div class="meta">${esc(x.supplier)} • Order by ${esc(x.orderUnit||x.unit||'')} • ${fmt(x.orderIncrement||1)} increment</div></div><div class="orderBtns"><button class="dragHandle" title="Press and drag" onpointerdown="beginLayoutDrag(event,${x.id})" onpointermove="moveLayoutDrag(event)" onpointerup="endLayoutDrag(event)" onpointercancel="endLayoutDrag(event)">☰</button><button ${i===0?'disabled':''} onclick="moveItemOrder(${x.id},-1)">↑</button><button ${i===list.length-1?'disabled':''} onclick="moveItemOrder(${x.id},1)">↓</button><button onclick="openEditItem(${x.id},'layout')">Edit</button></div></div><button class="insertHere" onclick="addItemAtPosition(${js(area)},${js(section)},${i+1})">＋ Add item here</button>`});let body=`<div class="card"><div class="label">Area</div><select onchange="state.layoutArea=this.value;state.layoutSection='';save('Layout filter');renderLayout()">${opt(meta.areas,area)}</select><div class="label">Section</div><select onchange="state.layoutSection=this.value;save('Layout filter');renderLayout()">${opt(secs,section)}</select><div class="dragHint"><b>Press and hold ☰, then drag the item up or down.</b> Release it where you want it. The arrows remain available as a backup.</div></div><div class="card" id="layoutRows">${rows||'No items in this section.'}</div>`;shell('Inventory Item Order',`${area} → ${section}`,body,`<button onclick="go('settings')">Back</button><button onclick="go('home')">Home</button>`)}
function beginLayoutDrag(ev,id){if(ev.button!==undefined&&ev.button!==0)return;const row=ev.currentTarget.closest('.orderRow');if(!row)return;layoutDrag={id,row,pointerId:ev.pointerId};row.classList.add('draggingRow');document.body.classList.add('reordering');try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()}
function moveLayoutDrag(ev){const row=layoutDrag.row;if(!row)return;ev.preventDefault();const el=document.elementFromPoint(ev.clientX,ev.clientY),target=el&&el.closest('.orderRow');if(!target||target===row||target.parentElement!==row.parentElement)return;const r=target.getBoundingClientRect();if(ev.clientY<r.top+r.height/2)target.parentElement.insertBefore(row,target);else target.parentElement.insertBefore(row,target.nextSibling)}
function endLayoutDrag(ev){const row=layoutDrag.row;if(!row)return;const parent=row.parentElement,ids=[...parent.querySelectorAll('.orderRow[data-id]')].map(el=>Number(el.dataset.id));ids.forEach((id,i)=>{const x=byId(id);if(x)x.sortOrder=i});row.classList.remove('draggingRow');document.body.classList.remove('reordering');layoutDrag={id:null,row:null,pointerId:null};save('Item order dragged');renderLayout()}
function addItemAtPosition(area,section,index){normalizeSectionOrder(area,section);state.pendingInsert={area,section,index:Number(index)};openEditItem(0,'layout',area,section)}
function normalizeSectionOrder(area,section){items.filter(x=>x.area===area&&x.section===section).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)||String(a.name).localeCompare(String(b.name))).forEach((x,i)=>x.sortOrder=i)}
function moveItemOrder(id,dir){const x=byId(id);normalizeSectionOrder(x.area,x.section);const list=items.filter(y=>y.area===x.area&&y.section===x.section).sort((a,b)=>a.sortOrder-b.sortOrder),i=list.findIndex(y=>y.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;const t=list[i].sortOrder;list[i].sortOrder=list[j].sortOrder;list[j].sortOrder=t;save('Item order changed');renderLayout()}
function historySummary(h){const all=h.items||[];const orders=all.filter(x=>Number(x.caseOrder||0)>0||Number(x.unitOrder||0)>0).length;const counted=all.filter(x=>x.touched||Number(x.caseOnHand||0)>0||Number(x.unitOnHand||0)>0||x.sectionDone).length;return `${counted} counted • ${orders} ordered`}
function renderHistory(){shell('History','Previous weekly inventories and orders',`<div class="card">${hist.length?hist.map((h,i)=>`<div class="listLine"><b>${new Date(h.date).toLocaleString()}</b><div class="meta">${esc(historySummary(h))}</div><button class="mini" onclick="viewHistory(${i})">View</button></div>`).join(''):'No saved history yet. Starting a new inventory will automatically save the current week here.'}</div>`,`<button onclick="go('home')">Home</button>`)}
function historyText(h){const all=h.items||[];let out='ELMEX INVENTORY HISTORY\n'+new Date(h.date).toLocaleString()+'\n';const groups=[...new Set(all.map(x=>(x.area||'')+'|||'+(x.section||'')))];groups.forEach(g=>{const [area,section]=g.split('|||');const rows=all.filter(x=>(x.area||'')===area&&(x.section||'')===section).filter(x=>x.touched||x.sectionDone||Number(x.caseOnHand||0)>0||Number(x.unitOnHand||0)>0||Number(x.caseOrder||0)>0||Number(x.unitOrder||0)>0);if(!rows.length)return;out+='\n'+area+' → '+section+'\n';rows.forEach(x=>{let parts=[];if(Number(x.caseOnHand||0)>0)parts.push('on hand '+fmt(x.caseOnHand)+' '+(x.inventoryUnit||x.unit||''));if(Number(x.unitOnHand||0)>0)parts.push('loose on hand '+fmt(x.unitOnHand));if(Number(x.caseOrder||0)>0)parts.push('order '+fmt(x.caseOrder)+' '+(x.orderUnit||x.unit||''));if(Number(x.unitOrder||0)>0)parts.push('order loose '+fmt(x.unitOrder));out+='- '+x.name+(parts.length?' — '+parts.join(' | '):' — counted')+'\n'})});return out.trim()}
function viewHistory(i){const h=hist[i],txt=historyText(h);shell('Saved Inventory',new Date(h.date).toLocaleString(),`<div class="card"><div class="meta">${esc(historySummary(h))}</div></div><textarea id="historyText">${esc(txt)}</textarea><button onclick="copyHistory()">Copy</button>`,`<button onclick="go('history')">Back</button>`)}
async function copyHistory(){const txt=document.getElementById('historyText').value;try{await navigator.clipboard.writeText(txt);alert('History copied.')}catch(e){prompt('Copy this history:',txt)}}
function renderSaveCenter(){let storage='Unknown';try{storage=Math.round((localStorage.getItem(K.data)||'').length/1024)+' KB'}catch(e){}shell('Save & Recovery','Verify your work before a full inventory run',`<div class="card"><h2>Current Save Status</h2><p class="${state.saveOk===false?'dangerText':'savedText'}">${state.saveOk===false?'Save failed: '+esc(state.saveError||'Unknown error'):'Saved successfully at '+nowLabel(state.lastSaved)}</p><div class="meta">Local backup size: ${storage}</div><div class="meta ${lastDbSaveOk?'':'warningText'}">Secondary IndexedDB backup: ${lastDbSaveOk?'Ready':'⚠ Warning only — primary local save succeeded; secondary backup unavailable: '+esc(lastDbSaveError||'unknown')}</div><br><button class="ok" onclick="manualSave()">💾 Save Now</button> <button onclick="recover()">↩ Restore Recovery Snapshot</button></div><div class="card"><h2>Backup File</h2><button onclick="exportData()">⬇ Export Backup</button><br><br><input type="file" accept="application/json" onchange="importData(event)"><div class="hint">Android usually saves the file in Downloads. Filename starts with elmex-manager-v1-9-0-backup.</div></div><div class="card"><h2>Save Test</h2><button onclick="runSaveTest()">Run Save Test</button><div id="testResult" class="hint">This writes and rereads a harmless test value without changing inventory.</div></div>`,`<button onclick="go('settings')">Settings</button><button onclick="go('home')">Home</button>`)}
function runSaveTest(){const key='elmex_v17_test',v='test-'+Date.now();try{localStorage.setItem(key,v);const ok=localStorage.getItem(key)===v;localStorage.removeItem(key);document.getElementById('testResult').innerHTML=ok?'<span class="savedText">PASS — phone storage can write and read app data.</span>':'<span class="dangerText">FAIL — storage did not return the saved value.</span>'}catch(e){document.getElementById('testResult').innerHTML='<span class="dangerText">FAIL — '+esc(e.message)+'</span>'}}
function exportData(){save('Before backup export');const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='elmex-manager-v1-9-0-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);alert('Backup export started. Check your Downloads folder.')}
function importData(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error('Backup does not contain an item list.');if(!confirm('Import this backup? Current app data will be replaced after a recovery snapshot is created.'))return;localStorage.setItem(K.recovery,JSON.stringify(snapshot()));({items,suppliers,supplierProfiles,meta,state,hist}=d);ensure();state.screen='home';save('Backup imported');alert('Backup imported successfully.');render()}catch(e){alert('Import failed: '+e.message)}};r.readAsText(file)}
function clearOrders(){if(confirm('Clear all active order quantities and purchased marks?')){items.forEach(x=>{x.caseOrder=0;x.unitOrder=0;x.purchased=false;x.orderStatus='open';x.carryOverSince=null;x.sectionDone=false});save('Orders cleared');render()}}
function resetApp(){if(!confirm('Reset all saved app data? Export a backup first.'))return;if(!confirm('This cannot be undone unless you have a backup. Continue?'))return;localStorage.removeItem(K.data);localStorage.removeItem(K.recovery);location.reload()}
async function initializeApp(){const localData=load();let dbData=await dbRead();try{const localTime=Date.parse(localData&&localData.savedAt||0)||Number(state.lastSaved||0),dbTime=Date.parse(dbData&&dbData.savedAt||0)||Number(dbData&&dbData.state&&dbData.state.lastSaved||0);if(dbData&&Array.isArray(dbData.items)&&dbTime>localTime){({items,suppliers,supplierProfiles,meta,state,hist}=dbData);ensure();state.lastSaveReason='Recovered from persistent database'}}catch(e){}try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}save('Startup synchronized');render()}
window.addEventListener('pagehide',()=>save('Page closing - immediate'));window.addEventListener('freeze',()=>save('App frozen - immediate'));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save('App hidden')});window.addEventListener('beforeunload',()=>save('Before unload'));setInterval(()=>save('15-second safety autosave'),15000);
initializeApp();
</script>
